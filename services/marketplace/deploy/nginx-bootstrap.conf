# Bootstrap only: public authentication stays closed until production services are configured.
# Install after certbot has issued the SAN certificate for both names.
server {
    listen 80;
    server_name kasapchy.api.ermekten.com test-kasapchy.api.ermekten.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name kasapchy.api.ermekten.com;
    ssl_certificate /etc/letsencrypt/live/kasapchy.api.ermekten.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasapchy.api.ermekten.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / {
        default_type application/json;
        add_header Retry-After 3600 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":"Service is being prepared"}';
    }
}
server {
    listen 443 ssl;
    server_name test-kasapchy.api.ermekten.com;
    ssl_certificate /etc/letsencrypt/live/kasapchy.api.ermekten.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasapchy.api.ermekten.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location = /healthz {
        proxy_pass http://127.0.0.1:5700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store always;
    }
    location / {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"Staging authentication is not configured"}';
    }
}
