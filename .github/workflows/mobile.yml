name: Mobile
on:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main, master, codex/kmp-mobile-wireflow]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleApiDebug :androidApp:bundleDemoRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kasapchy-demo-android
          path: |
            apps/mobile/androidApp/build/outputs/apk/debug/*.apk
            apps/mobile/androidApp/build/outputs/bundle/demoRelease/*.aab
